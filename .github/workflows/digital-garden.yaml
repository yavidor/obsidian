name: Update the Digital Garden Repository

on:
  push:
    branches:
      - main

concurrency:
  group: "updates"
  cancel-in-progress: false

jobs:
  call-garden-workflow:
  uses: benc-uk/workflow-dispatch@v1
  with:
    repo: yavidor/digital-garden
    workflow: update-contents.yaml
    token: "${{ secrets.GARDEN_ACCESS_TOKEN }}"

